name: Compile KConsole Module Only

on:
  push:
    paths:
      - 'drivers/misc/kconsole/**'
  workflow_dispatch:

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 13.1-new

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Diagnostic Build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make ARCH=arm64 CC=clang vendor/meteoric_defconfig
          make ARCH=arm64 CC=clang olddefconfig
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip prepare
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip scripts
          
          echo "=== ДІАГНОСТИКА: Збірка з МАКСИМАЛЬНИМ логуванням (V=1) ==="
          # Додаємо || true, щоб Actions не зупинив скрипт при помилці, і ми побачили логи нижче
          make -j$(nproc) ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            V=1 \
            CONFIG_KCONSOLE=m \
            M=drivers/misc/kconsole modules || true
            
          echo "=== ДІАГНОСТИКА: Вміст згенерованого kconsole.mod.c ==="
          cat drivers/misc/kconsole/kconsole.mod.c || echo "Файл не знайдено"
          
          echo "=== ДІАГНОСТИКА: Точна команда виклику компілятора ==="
          cat drivers/misc/kconsole/.kconsole.mod.o.cmd || echo "Файл не знайдено"
          
          # Примусово фейлимо крок в кінці, щоб ти бачив, що це тест
          exit 1
