name: Compile KConsole Module Only

on:
  push:
    paths:
      - 'drivers/misc/kconsole/**'
  workflow_dispatch:

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 13.1-new

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Inject Kbuild Module Fix
        run: |
          echo "=== Фікс для повноцінної ініціалізації модулів ==="
          # Прописуємо чітке синтаксичне значення для arm64 і примусово підключаємо опис 'struct module'
          echo "" >> include/linux/export.h
          echo "#include <linux/module.h>" >> include/linux/export.h
          echo "#ifndef MODULE_ARCH_INIT" >> include/linux/export.h
          echo "#define MODULE_ARCH_INIT {}" >> include/linux/export.h
          echo "#endif" >> include/linux/export.h

      - name: Compile Module Only
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo "=== 1. Створення базової конфігурації ==="
          make ARCH=arm64 CC=clang vendor/meteoric_defconfig
          
          echo "=== 2. Оновлення конфігурації ==="
          make ARCH=arm64 CC=clang olddefconfig
          
          echo "=== 3. Примусове генерування заголовочних файлів ==="
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            prepare
          
          echo "=== 3.5. Збірка утиліти modpost ==="
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            scripts
          
          echo "=== 4. Збірка самого модуля ==="
          make -j$(nproc) ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            M=drivers/misc/kconsole modules

      - name: Upload KConsole Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kconsole-module
          path: drivers/misc/kconsole/kconsole.ko
