name: Compile KConsole Module Only

on:
  push:
    paths:
      - 'drivers/misc/kconsole/**'
  workflow_dispatch:

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 13.1-new

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Compile Module Only
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo "=== 1. Створення базової конфігурації ==="
          make ARCH=arm64 CC=clang vendor/meteoric_defconfig
          
          echo "=== 2. Оновлення конфігурації ==="
          make ARCH=arm64 CC=clang olddefconfig
          
          echo "=== 3. Примусове генерування заголовочних файлів ядра ==="
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            prepare
          
          echo "=== 3.5. Збірка утиліти modpost ==="
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            scripts
          
          echo "=== 4. ЯДЕРНИЙ ФІКС: Взлом скрипта modpost ==="
          # Ми прописуємо прапорці компілятора безпосередньо у внутрішній скрипт Kbuild.
          # Тепер ядро фізично не зможе їх проігнорувати на етапі збірки .mod.c файлу!
          echo "" >> scripts/Makefile.modpost
          echo 'CFLAGS_MODULE += -include linux/module.h -DMODULE_ARCH_INIT={}' >> scripts/Makefile.modpost
          echo 'KBUILD_CFLAGS_MODULE += -include linux/module.h -DMODULE_ARCH_INIT={}' >> scripts/Makefile.modpost
          
          echo "=== 5. Примусова збірка зовнішнього модуля ==="
          # Додаємо CONFIG_KCONSOLE=m, щоб ядро не пропустило папку, і запускаємо збірку.
          make -j$(nproc) ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CONFIG_KCONSOLE=m \
            M=drivers/misc/kconsole modules
            
          echo "=== 6. Перевірка наявності файлу ==="
          ls -la drivers/misc/kconsole/

      - name: Upload KConsole Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kconsole-module
          path: drivers/misc/kconsole/kconsole.ko
