name: Compile KConsole Module Only

on:
  push:
    paths:
      - 'drivers/misc/kconsole/**'
  workflow_dispatch:

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 13.1-new

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Compile Module Only
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo "=== 1. Створення базової конфігурації ==="
          make ARCH=arm64 CC=clang vendor/meteoric_defconfig
          
          echo "=== 2. Автоматична модифікація файлу drivers/misc/Makefile ==="
          # Цей рядок сам допише потрібну команду у файл під час роботи GitHub Actions
          echo "obj-m += kconsole/" >> drivers/misc/Makefile
          
          echo "=== 3. Оновлення конфігурації ==="
          make ARCH=arm64 CC=clang olddefconfig
          
          echo "=== 4. Підготовка середовища модулів (запобігає MODULE_ARCH_INIT) ==="
          make -j$(nproc) ARCH=arm64 CC=clang \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            modules_prepare
          
          echo "=== 5. Збірка модуля та запуск modpost ==="
          make -j$(nproc) ARCH=arm64 CC=clang \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            M=drivers/misc/kconsole modules

      - name: Verify Module Existence
        run: |
          echo "=== Перевірка наявності файлів у папці ==="
          ls -la drivers/misc/kconsole/

      - name: Upload KConsole Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kconsole-module
          path: drivers/misc/kconsole/*.ko
