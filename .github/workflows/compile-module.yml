name: Compile KConsole Module Only

on:
  push:
    paths:
      - 'drivers/misc/kconsole/**'
  workflow_dispatch:

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 13.1-new

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Create Compiler Interceptor (The Ultimate Fix)
        run: |
          echo "=== Створення скрипта-перехоплювача ==="
          cat << 'EOF' > clang-wrapper
          #!/bin/bash
          for arg in "$@"; do
            if [[ "$arg" == *.mod.c ]]; then
              echo "=== ПЕРЕХОПЛЕНО ФАЙЛ: $arg ==="
              
              # Видаляємо оригінальний #include <linux/module.h>, щоб уникнути конфліктів
              grep -v "#include <linux/module.h>" "$arg" > temp.c
              
              # Пишемо наш "патч"
              cat << 'PATCH' > override.c
          // Фіктивна структура module для проходження компіляції modpost
          struct module {
              int state;
              struct list_head list;
              char name[64 - sizeof(unsigned long)];
              void *init;
              void *exit;
              struct module_arch_specific { } arch;
          };
          
          #ifndef MODULE_ARCH_INIT
          #define MODULE_ARCH_INIT {}
          #endif
          PATCH
              
              # Додаємо залишок оригінального файлу
              cat temp.c >> override.c
              mv override.c "$arg"
              rm -f temp.c
            fi
          done
          
          # Запускаємо справжній clang
          exec clang "$@"
          EOF
          
          chmod +x clang-wrapper

      - name: Compile Module Only
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export REAL_CC="$(pwd)/clang-wrapper"
          
          echo "=== 1. Створення базової конфігурації ==="
          make ARCH=arm64 CC="$REAL_CC" vendor/meteoric_defconfig
          
          echo "=== 2. Оновлення конфігурації ==="
          make ARCH=arm64 CC="$REAL_CC" olddefconfig
          
          echo "=== 3. Примусове генерування заголовочних файлів ядра ==="
          make ARCH=arm64 CC="$REAL_CC" CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip prepare
            
          echo "=== 4. Збірка утиліти modpost ==="
          make ARCH=arm64 CC="$REAL_CC" CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip scripts
          
          echo "=== 5. Примусова збірка зовнішнього модуля ==="
          make -j$(nproc) ARCH=arm64 CC="$REAL_CC" CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CONFIG_KCONSOLE=m \
            M=drivers/misc/kconsole modules
            
          echo "=== 6. Перевірка наявності файлу ==="
          ls -la drivers/misc/kconsole/

      - name: Upload KConsole Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kconsole-module
          path: drivers/misc/kconsole/kconsole.ko
