name: Compile KConsole Module Only

on:
  push:
    paths:
      - 'drivers/misc/kconsole/**'
  workflow_dispatch:

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 13.1-new

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Hard-Fix Driver Code
        run: |
          echo "=== Філігранний інжект фіксу в код драйвера ==="
          # Створюємо тимчасовий файл з фіксом структур
          echo "#include <linux/module.h>" > temp_fix.c
          echo "#ifndef MODULE_ARCH_INIT" >> temp_fix.c
          echo "#define MODULE_ARCH_INIT {}" >> temp_fix.c
          echo "#endif" >> temp_fix.c
          
          # Склеюємо фікс із твоїм оригінальним файлом kconsole.c
          cat drivers/misc/kconsole/kconsole.c >> temp_fix.c
          mv temp_fix.c drivers/misc/kconsole/kconsole.c
          
          echo "=== Перевірка перших рядків файлу ==="
          head -n 10 drivers/misc/kconsole/kconsole.c

      - name: Compile Module Only
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo "=== 1. Створення базової конфігурації ==="
          make ARCH=arm64 CC=clang vendor/meteoric_defconfig
          
          echo "=== 2. Оновлення конфігурації ==="
          make ARCH=arm64 CC=clang olddefconfig
          
          echo "=== 3. Примусове генерування ВСІХ заголовочних файлів ядра ==="
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            prepare
          
          echo "=== 3.5. Збірка утиліти modpost ==="
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            scripts
          
          echo "=== 4. Точкова збірка модуля через внутрішній Kbuild ==="
          # Додаємо прапорці ігнорування помилок символів та передаємо локальні прапорці CFLAGS
          make -j$(nproc) ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KBUILD_MODPOST_WARN=1 \
            KCFLAGS="-DMODULE_ARCH_INIT={} -include linux/module.h" \
            drivers/misc/kconsole/kconsole.ko
            
          echo "=== Перевірка наявності згенерованого файлу ==="
          ls -la drivers/misc/kconsole/

      - name: Upload KConsole Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kconsole-module
          path: drivers/misc/kconsole/kconsole.ko
