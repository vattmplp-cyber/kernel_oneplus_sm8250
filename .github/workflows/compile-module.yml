name: Compile KConsole Module Only

on:
  push:
    paths:
      - 'drivers/misc/kconsole/**'
  workflow_dispatch:

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 13.1-new

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Compile Module Only
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo "=== 1. Створення базової конфігурації ==="
          make ARCH=arm64 CC=clang vendor/meteoric_defconfig
          
          echo "=== 2. УВІМКНЕННЯ ПІДТРИМКИ МОДУЛІВ (Ось де була проблема!) ==="
          # Змінюємо .config, щоб ядро розблокувало struct module та дозволило збірку .ko
          ./scripts/config --file .config --enable CONFIG_MODULES
          ./scripts/config --file .config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --file .config --module CONFIG_KCONSOLE
          
          echo "=== 3. Оновлення конфігурації ==="
          make ARCH=arm64 CC=clang olddefconfig
          
          echo "=== 4. Підготовка ядра та скриптів ==="
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            prepare scripts
          
          echo "=== 5. Збірка зовнішнього модуля kconsole ==="
          make -j$(nproc) ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            M=drivers/misc/kconsole modules
            
          echo "=== 6. Перевірка наявності файлу ==="
          ls -la drivers/misc/kconsole/

      - name: Upload KConsole Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kconsole-module
          path: drivers/misc/kconsole/kconsole.ko
