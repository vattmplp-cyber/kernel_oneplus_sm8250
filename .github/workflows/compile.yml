name: Build Meteoric Stable 13.1 g

on:
  workflow_dispatch:
  push:
    branches:
      - work/monitor-mode-stability-injection
      - 'inject-*'

concurrency:
  group: monitor-mode-kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          set -euo pipefail
          echo "=== Source revision ==="
          git rev-parse HEAD
          echo "=== 1. Створення базової конфігурації ==="
          make O=out vendor/meteoric_defconfig
          
          echo "=== 2. Оновлення конфігурації під поточне ядро ==="
          make O=out ARCH=arm64 CC=clang olddefconfig

          echo "=== Verify diagnostic kernel configuration ==="
          grep -qx 'CONFIG_DEBUG_FS=y' out/.config
          grep -qx 'CONFIG_DYNAMIC_DEBUG=y' out/.config
          grep -qx 'CONFIG_PRINTK_TIME=y' out/.config
          grep -qx 'CONFIG_LOG_BUF_SHIFT=20' out/.config

          echo "=== Qualcomm qcacld compile check ==="
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip drivers/staging/qcacld-3.0/

          echo "=== 3. Повна збірка всього іншого ядра ==="
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Save Build Identity and Diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/debug-manifest/qcacld-commands
          {
            echo "=== SOURCE ==="
            git rev-parse HEAD
            git log -1 --format='%H%n%ci%n%s'
            echo "=== KERNEL CONFIG ==="
            grep -E '^(CONFIG_(DEBUG_FS|DYNAMIC_DEBUG|PRINTK_TIME|LOG_BUF_SHIFT|IKCONFIG_PROC|QCA_CLD_WLAN|QCA_CLD_WLAN_PROFILE))=' out/.config
            echo "=== QCA6390 DRIVER PROFILE ==="
            grep -nE '^(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT|CONFIG_FEATURE_MONITOR_MODE_SUPPORT|CONFIG_WLAN_LOG_(FATAL|ERROR|WARN|INFO|DEBUG|ENTER|EXIT)|BUILD_DEBUG_VERSION) *[:=]' drivers/staging/qcacld-3.0/configs/qca6390_defconfig
            echo "=== DRIVER COMPILE FLAGS ==="
            find out/drivers/staging/qcacld-3.0 -type f -name '.*.cmd' -print0 |
              xargs -0 grep -hEo -- '-DFEATURE_FRAME_INJECTION_SUPPORT|-DWLAN_LOG_(FATAL|ERROR|WARN|INFO|DEBUG|ENTER|EXIT)|-DWLAN_DEBUG' |
              sort -u
            echo "=== IMAGE HASHES ==="
            sha256sum out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz
          } > out/debug-manifest/build-identity.txt

          find out/drivers/staging/qcacld-3.0 -type f -name '.*.cmd' -print0 |
            while IFS= read -r -d '' f; do
              if grep -Eq -- 'FEATURE_FRAME_INJECTION_SUPPORT|DWLAN_LOG_(FATAL|ERROR|WARN|INFO|DEBUG|ENTER|EXIT)' "$f"; then
                cp "$f" "out/debug-manifest/qcacld-commands/$(basename "$(dirname "$f")")_$(basename "$f")"
              fi
            done

          # The qcacld driver may be built as a separate object/module rather
          # than linked into vmlinux. Scan the actual driver objects as well.
          {
            find out/drivers/staging/qcacld-3.0 -type f \( -name '*.o' -o -name '*.ko' \) -print0 |
              xargs -0 -r -n1 strings
            strings out/vmlinux
          } | grep -E 'Frame injection initialized successfully|Processing frame injection|Injection:|Injection TX' | sort -u > out/debug-manifest/injection-strings.txt || {
            echo "::warning::No expected injection strings found in compiled objects; inspect object-symbol checks and build manifest."
            : > out/debug-manifest/injection-strings.txt
          }

          test -s out/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.o
          test -s out/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.o
          if strings out/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.o | grep -q 'Frame injection initialized successfully'; then
            echo 'PASS: HDD injection object contains init log string'
          else
            echo '::warning::HDD injection init string absent; verify symbols and compile flags'
          fi
          if strings out/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.o | grep -q 'Injection TX helper vdev created'; then
            echo 'PASS: WMA helper-VDEV log string present'
          else
            echo '::warning::WMA helper-VDEV log string absent; verify symbols and compile flags'
          fi
          grep -q -- '-DFEATURE_FRAME_INJECTION_SUPPORT' out/debug-manifest/build-identity.txt
          grep -q -- '-DWLAN_LOG_DEBUG' out/debug-manifest/build-identity.txt

      - name: Upload Kernel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Meteoric-Kebab-DIAGNOSTIC
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/.config
            out/System.map
            out/debug-manifest/**
