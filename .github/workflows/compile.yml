name: Copy RTL8188EUS Driver
on:
  workflow_dispatch:

jobs:
  copy-driver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 13.1-new

      - name: Download and Copy Driver
        run: |
          cd drivers/net/wireless
          git clone https://github.com/aircrack-ng/rtl8188eus.git rtl8188eus
