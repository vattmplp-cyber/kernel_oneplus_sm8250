name: Build Meteoric Stable 13.1 g

on:
  workflow_dispatch:
  push:
    branches:
      - work/monitor-mode-stability-injection
      - 'inject-*'

concurrency:
  group: monitor-mode-kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Build Kernel
        id: build_kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          set -euo pipefail
          echo "=== Source revision ==="
          git rev-parse HEAD
          echo "=== 1. Створення базової конфігурації ==="
          make O=out vendor/meteoric_defconfig
          
          echo "=== 2. Оновлення конфігурації під поточне ядро ==="
          make O=out ARCH=arm64 CC=clang olddefconfig

          echo "=== Verify diagnostic kernel configuration ==="
          grep -qx 'CONFIG_DEBUG_FS=y' out/.config
          grep -qx 'CONFIG_DYNAMIC_DEBUG=y' out/.config
          grep -qx 'CONFIG_PRINTK_TIME=y' out/.config
          grep -qx 'CONFIG_LOG_BUF_SHIFT=20' out/.config

          echo "=== Qualcomm qcacld compile check ==="
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip drivers/staging/qcacld-3.0/

          echo "=== 3. Повна збірка всього іншого ядра ==="
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

          echo "=== Verify embedded IKCONFIG matches the actual build config ==="
          python3 - <<'PY'
          import gzip
          import re
          from pathlib import Path

          image_path = Path("out/arch/arm64/boot/Image")
          config_path = Path("out/.config")
          image = image_path.read_bytes()
          start = image.find(b"IKCFG_ST")
          end = image.find(b"IKCFG_ED", start + 8) if start >= 0 else -1
          if start < 0 or end < 0:
              raise SystemExit("ERROR: IKCONFIG markers missing from built Image")
          try:
              embedded = gzip.decompress(image[start + 8:end]).decode()
          except Exception as exc:
              raise SystemExit(f"ERROR: cannot decompress embedded IKCONFIG: {exc}")

          def parse_config(text):
              values = {}
              for line in text.splitlines():
                  if line.startswith("CONFIG_") and "=" in line:
                      key, value = line.split("=", 1)
                      values[key] = value
                  else:
                      match = re.fullmatch(r"# (CONFIG_[A-Za-z0-9_]+) is not set", line)
                      if match:
                          values[match.group(1)] = "n"
              return values

          built = parse_config(config_path.read_text())
          embedded_values = parse_config(embedded)
          differences = []
          for key in sorted(set(built) | set(embedded_values)):
              if built.get(key) != embedded_values.get(key):
                  differences.append((key, built.get(key, "<missing>"), embedded_values.get(key, "<missing>")))
          if differences:
              for key, expected, actual in differences[:100]:
                  print(f"MISMATCH {key}: build={expected}, embedded={actual}")
              raise SystemExit(f"ERROR: embedded IKCONFIG differs from out/.config ({len(differences)} entries)")
          required = {
              "CONFIG_IKCONFIG_PROC": "y",
              "CONFIG_DEBUG_FS": "y",
              "CONFIG_DYNAMIC_DEBUG": "y",
              "CONFIG_PRINTK_TIME": "y",
              "CONFIG_LOG_BUF_SHIFT": "20",
          }
          for key, expected in required.items():
              actual = embedded_values.get(key)
              print(f"{key}={actual}")
              if actual != expected:
                  raise SystemExit(f"ERROR: {key}: expected {expected}, got {actual}")
          print("PASS: embedded IKCONFIG exactly matches out/.config")
          PY

      # This step is diagnostic only. Missing optional strings/flags must never
      # prevent the kernel image and diagnostic files from being uploaded.
      - name: Save Build Identity and Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p out/debug-manifest/qcacld-commands
          MANIFEST=out/debug-manifest/build-identity.txt
          : > "$MANIFEST"
          if [ -f out/.config ]; then cp out/.config out/debug-manifest/kernel.config; fi

          {
            echo "=== BUILD STEP RESULT ==="
            echo "Build Kernel outcome: ${{ steps.build_kernel.outcome }}"
            echo "=== SOURCE ==="
            git rev-parse HEAD 2>&1 || true
            git log -1 --format='%H%n%ci%n%s' 2>&1 || true
            echo "=== KERNEL CONFIG ==="
            if [ -f out/.config ]; then
              grep -E '^(CONFIG_(DEBUG_FS|DYNAMIC_DEBUG|PRINTK_TIME|LOG_BUF_SHIFT|IKCONFIG_PROC|QCA_CLD_WLAN|QCA_CLD_WLAN_PROFILE))=' out/.config || echo "No matching kernel config entries"
            else
              echo "out/.config is missing"
            fi
            echo "=== QCA6390 DRIVER PROFILE ==="
            grep -nE '^(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT|CONFIG_FEATURE_MONITOR_MODE_SUPPORT|CONFIG_WLAN_LOG_(FATAL|ERROR|WARN|INFO|DEBUG|ENTER|EXIT)|BUILD_DEBUG_VERSION) *[:=]' drivers/staging/qcacld-3.0/configs/qca6390_defconfig 2>&1 || echo "No matching driver profile entries"
            echo "=== DRIVER COMPILE FLAGS ==="
            if [ -d out/drivers/staging/qcacld-3.0 ]; then
              find out/drivers/staging/qcacld-3.0 -type f -name '.*.cmd' -print0 |
                xargs -0 -r grep -hEo -- '-DFEATURE_FRAME_INJECTION_SUPPORT|-DWLAN_LOG_(FATAL|ERROR|WARN|INFO|DEBUG|ENTER|EXIT)|-DWLAN_DEBUG' 2>/dev/null |
                sort -u
              [ "${PIPESTATUS[0]}" -eq 0 ] || true
            else
              echo "qcacld build output directory is missing"
            fi
            echo "=== IMAGE HASHES ==="
            for image in out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz; do
              if [ -f "$image" ]; then sha256sum "$image"; else echo "MISSING: $image"; fi
            done
          } >> "$MANIFEST"

          # Save all matching compiler command files, but do not fail if none match.
          find out/drivers/staging/qcacld-3.0 -type f -name '.*.cmd' -print0 2>/dev/null |
            while IFS= read -r -d '' f; do
              if grep -Eq -- 'FEATURE_FRAME_INJECTION_SUPPORT|DWLAN_LOG_(FATAL|ERROR|WARN|INFO|DEBUG|ENTER|EXIT)' "$f"; then
                cp "$f" "out/debug-manifest/qcacld-commands/$(basename "$(dirname "$f")")_$(basename "$f")" || true
              fi
            done

          # The driver is normally a module: search vmlinux AND every built .ko.
          STRINGS_FILE=out/debug-manifest/injection-strings.txt
          : > "$STRINGS_FILE"
          FOUND_STRING_SOURCE=0
          while IFS= read -r -d '' binary; do
            if strings "$binary" 2>/dev/null |
              grep -E 'Frame injection initialized successfully|Processing frame injection|Injection:|Injection TX' >> "$STRINGS_FILE"; then
              echo "$binary" >> out/debug-manifest/injection-string-sources.txt
              FOUND_STRING_SOURCE=1
            fi
          done < <(find out -type f \( -name vmlinux -o -name '*.ko' \) -print0 2>/dev/null)
          sort -u "$STRINGS_FILE" -o "$STRINGS_FILE"
          if [ "$FOUND_STRING_SOURCE" -eq 0 ]; then
            echo "WARNING: no expected injection strings found in vmlinux or built modules" | tee -a "$MANIFEST"
          fi

          {
            echo "=== DIAGNOSTIC ASSERTIONS (NON-FATAL) ==="
            grep -q 'Frame injection initialized successfully' "$STRINGS_FILE" && echo "PASS: injection init string found" || echo "WARN: injection init string not found"
            grep -q -- '-DFEATURE_FRAME_INJECTION_SUPPORT' "$MANIFEST" && echo "PASS: frame injection compiler flag found" || echo "WARN: frame injection compiler flag not found"
            grep -q -- '-DWLAN_LOG_DEBUG' "$MANIFEST" && echo "PASS: WLAN_LOG_DEBUG compiler flag found" || echo "WARN: WLAN_LOG_DEBUG compiler flag not found"
          } | tee out/debug-manifest/diagnostic-checks.txt

          echo "Diagnostics completed; diagnostic warnings do not fail the build or block artifact upload."

      - name: Upload Kernel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Meteoric-Kebab-DIAGNOSTIC
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/.config
            out/System.map
            out/debug-manifest/**
