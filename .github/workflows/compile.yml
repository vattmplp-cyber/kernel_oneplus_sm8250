name: Copy RTL8188EUS Driver

on:
  workflow_dispatch: # Запуск вручну кнопкою "Run workflow"

jobs:
  copy-driver:
    runs-on: ubuntu-latest

    steps:
    # 1. Завантажуємо код вашого ядра
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # 2. Скачуємо драйвер як ZIP-архів та розпаковуємо у потрібну папку
    - name: Download and Unzip Driver
      run: |
        cd drivers/net/wireless/
        rm -rf rtl8188eus
        
        # Завантажуємо офіційний ZIP-архів драйвера
        wget https://github.com -O driver.zip
        
        # Розпаковуємо його
        unzip driver.zip
        
        # Перейменовуємо отриману папку на правильну назву
        mv rtl8188eus-master rtl8188eus
        
        # Видаляємо тимчасовий ZIP-файл
        rm driver.zip

    # 3. Зберігаємо папку назад у ваш GitHub форк
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add drivers/net/wireless/rtl8188eus/
        git commit -m "Add raw rtl8188eus driver folder via ZIP" || echo "No changes to commit"
        git push origin HEAD:${{ github.ref }}
