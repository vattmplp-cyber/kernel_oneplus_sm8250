name: Copy Driver
on:
  workflow_dispatch:

permissions:
  contents: write # Даємо право роботу Actions записувати файли у твій репо

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 13.1-new

      - run: |
          cd drivers/net/wireless
          git clone https://github.com/aircrack-ng/rtl8188eus.git
          
          # Оці команди збережуть папку в твій GitHub:
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rtl8188eus
          git commit -m "Додав драйвер"
          git push
