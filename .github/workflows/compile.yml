name: Build Meteoric Stable 13.1 g

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 13.1-new

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo "=== 1. Створення базової конфігурації ==="
          make O=out vendor/meteoric_defconfig
          
          echo "=== 1.2. АНТИ-ПІДПИСНИЙ БЛОК (Розблокування ядра) ==="
          # Видаляємо всі згадки про підписи з конфігу, щоб Kbuild не вимагав їх
          sed -i '/CONFIG_MODULE_SIG/d' out/.config
          echo "# CONFIG_MODULE_SIG is not set" >> out/.config
          echo "# CONFIG_MODULE_SIG_FORCE is not set" >> out/.config
          echo "# CONFIG_MODULE_SIG_ALL is not set" >> out/.config
          
          echo "=== 1.5. Впорскування драйвера RTL8188EUS ==="
          ./scripts/config --file out/.config --enable CONFIG_WIRELESS
          ./scripts/config --file out/.config --enable CONFIG_CFG80211
          ./scripts/config --file out/.config --enable CONFIG_CFG80211_WEXT
          ./scripts/config --file out/.config --enable CONFIG_RTL8188EUS
          ./scripts/config --file out/.config --enable CONFIG_RTL8188EUS_MONITOR
          
          echo "=== 2. Оновлення конфігурації ==="
          make O=out ARCH=arm64 CC=clang olddefconfig
          
          echo "=== 3. Повна збірка ядра ==="
          # Збираємо все ядро разом із вбудованим драйвером
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Meteoric-Kebab-Stable-Unsigned
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
