name: Copy RTL8188EUS Driver

on:
workflow_dispatch:

jobs:
copy-driver:
runs-on: ubuntu-latest

```
permissions:
  contents: write

steps:
  - name: Checkout Kernel Source
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Download RTL8188EUS v5.3.9
    run: |
      mkdir -p drivers/net/wireless
      cd drivers/net/wireless

      rm -rf rtl8188eus

      git clone --depth 1 -b v5.3.9 \
        https://github.com/aircrack-ng/rtl8188eus.git \
        rtl8188eus

      rm -rf rtl8188eus/.git

  - name: Commit and Push Changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"

      git add drivers/net/wireless/rtl8188eus

      git diff --staged --quiet || git commit -m "Import rtl8188eus v5.3.9"

      git push origin HEAD:${{ github.ref_name }}
```
