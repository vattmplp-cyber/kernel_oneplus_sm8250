name: Build Meteoric Stable 13.1

on:

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source

        uses: actions/checkout@v4

        with:

          ref: 13.1-new # Переконайся, що твоя робоча гілка називається саме так



      - name: Setup Build Environment

        run: |

          sudo apt update

          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu



      - name: Build Kernel

        run: |

          export ARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-

          

          echo "=== 1. Створення конфігурації ==="

          make O=out vendor/meteoric_defconfig

          

          echo "=== 2. Оновлення конфігурації під поточне ядро ==="

          make O=out ARCH=arm64 CC=clang olddefconfig

          

          echo "=== 3. Повна збірка ядра ==="

          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip



      - name: Upload Kernel Artifacts

        uses: actions/upload-artifact@v4

        with:

          name: Meteoric-Kebab-Stable

          path: |

            out/arch/arm64/boot/Image

            out/arch/arm64/boot/Image.gz 

