name: Build Android Kernel (Clean)

on:
  workflow_dispatch: # Дозволяє запускати збірку вручну через сайт GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lib64ncurses5-dev

    - name: Download Clang Toolchain
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain
        # Завантажуємо офіційний Google Clang (r416183b або аналогічний для Android 11/12/13)
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r416183b.tar.gz
        tar -xf clang-r416183b.tar.gz
        rm clang-r416183b.tar.gz

    - name: Build Kernel
      env:
        CCACHE_DIR: $GITHUB_WORKSPACE/.ccache
      run: |
        # Налаштування шляхів до компілятора
        export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Кроки збірки
        echo "=== Очищення та налаштування конфігурації ==="
        make clean && make mrproper
        
        # Замініть 'vendor/kona_defconfig' на точну назву defconfig-файлу вашого ядра (лежить в arch/arm64/configs/)
        make O=out vendor/kona_defconfig
        
        echo "=== Старт компіляції ядра ==="
        make -j$(nproc --all) O=out \
                      CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel
        path: out/arch/arm64/boot/Image.gz # Готовий стиснутий файл ядра для прошивки
