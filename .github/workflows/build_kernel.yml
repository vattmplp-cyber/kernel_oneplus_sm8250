- name: Переміщення драйвера Realtek та налаштування Makefile
        run: |
          # 1. Переходимо в папку з ядром (якщо у тебе збірка йде в конкретній папці, наприклад, kernel)
          # cd kernel_oneplus_sm8250

          # 2. Переносимо папку драйвера в realtek
          mkdir -p drivers/net/wireless/realtek
          mv drivers/net/wireless/rtl8188eus drivers/net/wireless/realtek/

          # 3. Автоматично прописуємо рядок у Makefile папки realtek
          echo "obj-\$(CONFIG_RTL8188EUS) += rtl8188eus/" >> drivers/net/wireless/realtek/Makefile
